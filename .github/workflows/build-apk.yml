name: Build APK

# Builds an installable debug APK in the cloud.
# - Push a tag like "v1.1.0" to publish a GitHub Release with the APK attached
#   (download it straight from your phone and install it).
# - Or run manually from the Actions tab; the APK is uploaded as a build artifact.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/codebase-review-kv52zb'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: space-invaders-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: Space Invaders (debug build)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'debug-latest' }}
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Debug build of Space Invaders for testing on a device.

            **Install:** download `app-debug.apk` below on your phone, then open it
            (you may need to allow installing from unknown sources). This is a debug
            build — unsigned for the Play Store, but fine for sideloading.

            Updated automatically on each push to the development branch.
